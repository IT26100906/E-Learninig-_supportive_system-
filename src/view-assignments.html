

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Assignments | LearnHub</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
    <script>requireAdmin();</script>
</head>
<body>
<header class="navbar">
    <div class="brand-area">
        <div class="menu-wrap">
            <button class="menu-button" onclick="toggleMenu()">☰</button>
            <div class="menu-dropdown" id="menuDropdown">
                <a href="admin.html">Admin Dashboard</a>
                <a href="create.html">Create Assignment</a>
                <a href="view.html">View Assignments</a>
            </div>
        </div>
        <a class="logo" href="admin.html">LearnHub</a>
    </div>
    <div class="nav-actions">
        <button class="theme-button" onclick="toggleTheme()">🌗</button>
        <button class="logout-button" onclick="logout()">Logout</button>
    </div>
</header>

<main class="container">
    <div class="card">
        <h1>View Homework</h1>
        <input id="search" placeholder="Search by title or course ID" oninput="showAssignments()">
        <div id="assignmentList"></div>
    </div>
</main>

<div class="bottom-navigation">
    <a class="back-button" href="admin.html">← Back to Dashboard</a>
</div>

<script>
    function showAssignments() {
        const assignments = JSON.parse(localStorage.getItem("assignments") || "[]");
        const query = document.getElementById("search").value.toLowerCase();
        const list = document.getElementById("assignmentList");
        list.replaceChildren();

        const filtered = assignments.filter(a =>
            (a.title || "").toLowerCase().includes(query) ||
            (a.courseId || "").toLowerCase().includes(query)
        );

        if (!filtered.length) {
            list.textContent = "No assignments found.";
            return;
        }

        filtered.forEach(a => {
            const card = document.createElement("div");
            card.className = "card";

            const title = document.createElement("h3");
            title.textContent = a.title;

            const details = document.createElement("p");
            details.textContent = "Homework ID: " + (a.homeworkId || a.id) +
                " | Course ID: " + (a.courseId || "-");

            const due = document.createElement("p");
            due.textContent = "Due Date: " + (a.deadline || "-");

            const edit = document.createElement("a");
            edit.className = "primary-button";
            edit.href = "edit.html?id=" + encodeURIComponent(a.id);
            edit.textContent = "Edit";

            const del = document.createElement("button");
            del.className = "logout-button";
            del.textContent = "Delete";
            del.style.marginLeft = "8px";

            del.onclick = () => {
                if (confirm("Delete this assignment?")) {
                    localStorage.setItem(
                        "assignments",
                        JSON.stringify(assignments.filter(item => item.id !== a.id))
                    );
                    showAssignments();
                }
            };

            card.append(title, details, due, edit, del);
            list.appendChild(card);
        });
    }

    showAssignments();
</script>
</body>
</html>
