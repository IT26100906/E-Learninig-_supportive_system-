


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Assignments - LearnHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="left">
        <button class="menu-btn" type="button">☰</button>
        <a href="view-assignments.html" class="logo">
            🎓 <span>LearnHub</span>
        </a>
    </div>
    <div class="right">
        <button class="theme-btn" type="button">🌗</button>
        <button class="logout-btn" type="button">Logout</button>
    </div>
</header>

<main class="container wide">
    <div class="card">
        <div class="heading">
            <div>
                <h1>My Assignments</h1>
                <p class="subtitle">View and manage all assignments.</p>
            </div>
            <a class="btn add-btn" href="create-assignment.html">
                + Add Assignment
            </a>
        </div>

        <form class="search" action="#" method="get">
            <input type="text" name="assignmentId"
                   placeholder="Search by Assignment ID">
            <button type="submit" class="btn">Search</button>
        </form>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>Assignment ID</th>
                    <th>Title</th>
                    <th>Due Date</th>
                    <th>Total Marks</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>A001</td>
                    <td>Java Programming</td>
                    <td>2026-10-25</td>
                    <td>100</td>
                    <td>
                        <a href="edit-assignment.html"
                           class="btn small">Edit</a>
                        <button type="button"
                                class="btn small delete-btn">
                            Delete
                        </button>
                    </td>
                </tr>
                <tr>
                    <td>A002</td>
                    <td>Database Assignment</td>
                    <td>2026-10-30</td>
                    <td>50</td>
                    <td>
                        <a href="edit-assignment.html"
                           class="btn small">Edit</a>
                        <button type="button"
                                class="btn small delete-btn">
                            Delete
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
