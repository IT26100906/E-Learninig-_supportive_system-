


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Assignment - LearnHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="left">
        <button class="menu-btn" type="button">☰</button>
        <a href="view-assignments.html" class="logo">
            🎓 <span>LearnHub</span>
        </a>
    </div>
    <div class="right">
        <button class="theme-btn" type="button">🌗</button>
        <button class="logout-btn" type="button">Logout</button>
    </div>
</header>

<main class="container">
    <div class="card">
        <h1>Edit Assignment</h1>
        <p class="subtitle">Update assignment details.</p>

        <form action="#" method="post">
            <label for="id">Assignment ID</label>
            <input type="text" id="id" name="assignmentId"
                   value="A001" readonly>

            <label for="title">Assignment Title</label>
            <input type="text" id="title" name="title"
                   value="Java Programming" required>

            <label for="date">Due Date</label>
            <input type="date" id="date" name="dueDate"
                   value="2026-10-25" required>

            <label for="marks">Total Marks</label>
            <input type="number" id="marks" name="totalMarks"
                   value="100" min="1" required>

            <button class="btn" type="submit">Update Assignment</button>
        </form>

        <a href="view-assignments.html" class="back-link">Cancel</a>
    </div>
</main>

</body>
</html>
