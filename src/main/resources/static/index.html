<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LearnHub | Course Details Management</title><style>
:root{--bg:#0b1220;--panel:#172235;--panel2:#202e45;--text:#f4f7ff;--muted:#aab8cf;--accent:#7764ff;--line:#34445d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#1b2450,var(--bg) 55%);font:15px system-ui;color:var(--text)}header{padding:24px clamp(18px,5vw,60px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px}header strong{font-size:22px}main{max-width:1150px;margin:35px auto;padding:0 20px;display:grid;grid-template-columns:340px 1fr;gap:22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 18px 50px #0002}h1{font-size:clamp(25px,3vw,36px);margin:0 0 8px}p,.muted{color:var(--muted)}form{display:grid;gap:12px}label{display:grid;gap:6px;color:#dce5f7;font-size:13px}input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#101a2b;color:white}button{border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:white;font-weight:700;cursor:pointer}button.secondary{background:var(--panel2);border:1px solid var(--line)}button.danger{background:#a8324a}.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{display:flex;gap:10px;margin-bottom:16px}.toolbar input{flex:1}.record{background:#101a2b;border:1px solid var(--line);padding:15px;border-radius:13px;margin:10px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.record pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;color:#e5ecfb}.notice{padding:11px;border-radius:10px;background:#252449;color:#d5ceff;margin:12px 0}@media(max-width:800px){main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div><strong>LearnHub <span style="color:#9e91ff">/ Member 2</span></strong><div class="muted">Course Details Management</div></div><div>Standalone IntelliJ + Spring Boot project</div></header><main><section class="panel"><h1>Course Details Management</h1><p>Add, view/search, edit title/duration, and delete courses.</p><div class="notice">API: <code>/api/courses</code> · Port: 8082</div><form id="record-form"><label>Course ID<input id="f-courseId" name="courseId" type="text"  required></label><label>Title<input id="f-title" name="title" type="text"  required></label><label>Description<input id="f-description" name="description" type="text"  required></label><label>Duration<input id="f-duration" name="duration" type="text"  required></label><div class="actions"><button type="submit" id="save-btn">Save record</button><button type="button" class="secondary" id="reset-btn">Clear</button></div></form><p id="status" class="muted"></p></section><section class="panel"><h2>Manage records</h2><div class="toolbar"><input id="search" placeholder="Search by course ID"><button id="search-btn" type="button">Search</button><button id="refresh-btn" type="button" class="secondary">Refresh</button></div><div id="records"></div></section></main><script>
const API='/api/courses', fields=["courseId", "title", "description", "duration"], idField='courseId';let editing=null;
const form=document.getElementById('record-form'), statusEl=document.getElementById('status'), records=document.getElementById('records');
function valObj(){const o={};for(const f of fields){const el=document.getElementById('f-'+f);o[f]=el.type==='number'?(el.value===''?null:Number(el.value)):el.value.trim();}return o}
function fill(o){for(const f of fields)document.getElementById('f-'+f).value=o[f]??'';editing=o[idField];document.getElementById('save-btn').textContent='Update record';window.scrollTo({top:0,behavior:'smooth'})}
function clearForm(){form.reset();editing=null;document.getElementById('save-btn').textContent='Save record'}
async function load(){try{const q=document.getElementById('search').value.trim();const r=await fetch(API+(q?'?q='+encodeURIComponent(q):''));if(!r.ok)throw Error('Request failed ('+r.status+')');const data=await r.json();records.innerHTML='';if(!data.length){records.innerHTML='<p class="muted">No records found. Add your first record using the form.</p>';return}for(const o of data){const el=document.createElement('div');el.className='record';const pre=document.createElement('pre');pre.textContent=fields.map(f=>f+': '+(o[f]??'')).join('\n');const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.className='secondary';edit.textContent='Edit';edit.onclick=()=>fill(o);const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=async()=>{if(confirm('Delete this record?')){const x=await fetch(API+'/'+encodeURIComponent(o[idField]),{method:'DELETE'});if(x.ok)load();else statusEl.textContent='Delete failed ('+x.status+')'}};actions.append(edit,del);el.append(pre,actions);records.append(el)}}catch(e){statusEl.textContent=e.message}}
form.addEventListener('submit',async e=>{e.preventDefault();const obj=valObj();try{const r=await fetch(API+(editing?'/'+encodeURIComponent(editing):''),{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});if(!r.ok){const t=await r.text();throw Error(t||'Request failed ('+r.status+')')}statusEl.textContent=editing?'Record updated successfully.':'Record created successfully.';clearForm();load()}catch(e){statusEl.textContent=e.message}});
document.getElementById('reset-btn').onclick=()=>{clearForm();statusEl.textContent=''};document.getElementById('refresh-btn').onclick=load;document.getElementById('search-btn').onclick=load;document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();load()}});load();
</script></body></html>
