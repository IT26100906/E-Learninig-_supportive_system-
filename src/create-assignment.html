

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Assignment - LearnHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="left">
        <button class="menu-btn" type="button">☰</button>
        <a href="view-assignments.html" class="logo">
            🎓 <span>LearnHub</span>
        </a>
    </div>
    <div class="right">
        <button class="theme-btn" type="button">🌗</button>
        <button class="logout-btn" type="button">Logout</button>
    </div>
</header>

<main class="container">
    <div class="card">
        <h1>Create Assignment</h1>
        <p class="subtitle">Add a new homework or assignment.</p>

        <form action="#" method="post">
            <label for="id">Assignment ID</label>
            <input type="text" id="id" name="assignmentId"
                   placeholder="Enter assignment ID" required>

            <label for="title">Assignment Title</label>
            <input type="text" id="title" name="title"
                   placeholder="Enter assignment title" required>

            <label for="date">Due Date</label>
            <input type="date" id="date" name="dueDate" required>

            <label for="marks">Total Marks</label>
            <input type="number" id="marks" name="totalMarks"
                   placeholder="Enter total marks" min="1" required>

            <button class="btn" type="submit">Create Assignment</button>
        </form>

        <a class="back-link" href="view-assignments.html">
            View All Assignments
        </a>
    </div>
</main>

</body>
</html>
