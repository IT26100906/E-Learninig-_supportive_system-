

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Assignment | LearnHub</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
    <script>requireAdmin();</script>
</head>
<body>
<header class="navbar">
    <div class="brand-area">
        <div class="menu-wrap">
            <button class="menu-button" onclick="toggleMenu()">☰</button>
            <div class="menu-dropdown" id="menuDropdown">
                <a href="admin.html">Admin Dashboard</a>
                <a href="create.html">Create Assignment</a>
                <a href="view.html">View Assignments</a>
            </div>
        </div>
        <a class="logo" href="admin.html">LearnHub</a>
    </div>
    <div class="nav-actions">
        <button class="theme-button" onclick="toggleTheme()">🌗</button>
        <button class="logout-button" onclick="logout()">Logout</button>
    </div>
</header>

<main class="container">
    <div class="card">
        <h1>Create Assignment</h1>
        <form id="assignmentForm">
            <label>Homework ID</label>
            <input id="homeworkId" required>

            <label>Course ID</label>
            <input id="courseId" required>

            <label>Title</label>
            <input id="title" required>

            <label>Description</label>
            <textarea id="description" required></textarea>

            <label>Due Date</label>
            <input id="deadline" type="datetime-local" required>

            <label>Total Marks</label>
            <input id="totalMarks" type="number" min="1" value="100" required>

            <button class="primary-button" type="submit">Save Assignment</button>
            <p id="message"></p>
        </form>
    </div>
</main>

<div class="bottom-navigation">
    <a class="back-button" href="admin.html">← Back to Dashboard</a>
</div>

<script>
    document.getElementById("assignmentForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const assignments = JSON.parse(localStorage.getItem("assignments") || "[]");

        assignments.push({
            id: Date.now().toString(),
            homeworkId: document.getElementById("homeworkId").value.trim(),
            courseId: document.getElementById("courseId").value.trim(),
            title: document.getElementById("title").value.trim(),
            description: document.getElementById("description").value.trim(),
            deadline: document.getElementById("deadline").value,
            totalMarks: Number(document.getElementById("totalMarks").value),
            marks: "",
            marksReleased: false
        });

        localStorage.setItem("assignments", JSON.stringify(assignments));
        document.getElementById("message").textContent = "Assignment saved successfully.";
        this.reset();
    });
</script>
</body>
</html>
